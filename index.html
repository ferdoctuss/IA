<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paul</title>

    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paul">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <meta name="theme-color" content="#ffffff" id="theme-color-meta">

    <style>
        :root {
            --bg-main: #ffffff;
            --bg-header: #ffffff;
            --border-color: #e5e5e5;
            --text-main: #1f1f1f;
            --text-secondary: #5f6368;
            --bubble-user: #f0f4f9;
            --bubble-user-text: #1f1f1f;
            --input-bg: #f0f4f9;
            --input-border: transparent;
            --card-bg: #f8fafd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #131314;
                --bg-header: #131314;
                --border-color: #3c4043;
                --text-main: #e3e3e3;
                --text-secondary: #9aa0a6;
                --bubble-user: #282a2c;
                --bubble-user-text: #e3e3e3;
                --input-bg: #1e1f20;
                --input-border: transparent;
                --card-bg: #1e1f20;
            }
        }

        html, body {
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .gemini-header {
            background-color: var(--bg-header);
            border-color: var(--border-color);
        }

        .gemini-bubble-ai {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.65;
            width: 100%;
        }

        /* Burbuja del usuario limitada al 85% */
        .gemini-bubble-user {
            background-color: var(--bubble-user);
            color: var(--bubble-user-text);
            border-radius: 24px;
            padding: 12px 18px;
            width: fit-content !important;
            max-width: 100% !important;
            margin-left: auto;
            font-size: 1.05rem;
            line-height: 1.45;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .gemini-bubble-user p {
            margin-bottom: 0 !important;
        }

        .gemini-input-container {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            transition: all 0.2s ease;
        }

        .gemini-input-container:focus-within {
            background-color: var(--bg-main);
            border-color: var(--border-color);
        }

        .markdown-content {
            overflow-wrap: break-word;
            max-width: 100%;
        }

        /* ELIMINA EL ESPACIO ENORME AL INICIO DE LA RESPUESTA */
        .markdown-content > div > *:first-child {
            margin-top: 0 !important;
        }

        .markdown-content p {
            margin-bottom: 1rem;
        }

        .markdown-content p:last-child {
            margin-bottom: 0;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 1.4rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .markdown-content ul {
            list-style-type: disc;
            margin-left: 1.4rem;
            margin-bottom: 1.2rem;
        }

        .markdown-content ol {
            list-style-type: decimal;
            margin-left: 1.4rem;
            margin-bottom: 1.2rem;
        }

        .markdown-content li {
            margin-bottom: 0.6rem;
            padding-left: 0.2rem;
        }

        .markdown-content strong {
            font-weight: 600;
        }

        .markdown-content code {
            background: rgba(0,0,0,0.06);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 90%;
            word-break: break-all;
        }

        .markdown-content table {
            width: 100%;
            display: block;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 1.2rem;
            border-collapse: collapse;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        /* Tarjeta de Video de YouTube estilo Gemini */
        .yt-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .yt-card:active {
            transform: scale(0.98);
        }

        .yt-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
            box-shadow: 0 2px 8px rgba(255, 0, 0, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            .markdown-content code {
                background: rgba(255,255,255,0.1);
            }
        }

        @keyframes bounce-custom {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1.0);
            }
        }

        .typing-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce-custom 1.4s infinite ease-in-out both;
            margin-right: 2px;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>

<body class="flex flex-col justify-between h-full w-full">

    <!-- Panel lateral de historial -->
    <div id="history-drawer" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden transition-opacity duration-300 flex justify-start">
        <div class="w-80 h-full bg-[var(--bg-main)] border-r border-[var(--border-color)] flex flex-col p-4 shadow-2xl transition-transform duration-300">

            <div class="flex items-center justify-between pb-4 border-b border-[var(--border-color)]">
                <h2 class="font-medium text-base">Historial de Chats</h2>

                <button onclick="toggleHistoryDrawer()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <button onclick="startNewChat()" class="mt-4 w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-medium text-sm transition shadow flex items-center justify-center gap-2">
                <span>+ Nuevo chat</span>
            </button>

            <div id="history-list" class="flex-1 overflow-y-auto mt-4 space-y-2"></div>
        </div>

        <div class="flex-1" onclick="toggleHistoryDrawer()"></div>
    </div>

    <!-- Cabecera -->
    <header class="gemini-header flex items-center justify-between px-4 py-3 border-b border-[var(--border-color)] select-none z-20 transition-colors duration-300 flex-shrink-0 relative">

        <div class="flex items-center gap-2">
            <button onclick="toggleHistoryDrawer()" class="w-10 h-10 rounded-full flex items-center justify-center text-[var(--text-main)] hover:bg-black/5 dark:hover:bg-white/5 transition flex-shrink-0" title="Historial">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <div class="flex items-center gap-1 py-1.5 px-3">
                <span class="text-[17px] font-medium tracking-wide text-[var(--text-main)]">Paul</span>
                <span class="text-[17px] text-[var(--text-secondary)] font-normal">Flash</span>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-shrink-0">
            <div class="flex items-center border border-[var(--border-color)] rounded-full bg-[var(--bg-main)] overflow-hidden">

                <button onclick="startNewChat()" class="p-2.5 hover:bg-black/5 dark:hover:bg-white/5 transition flex items-center justify-center text-[var(--text-main)]" title="Nuevo chat">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"></path>
                    </svg>
                </button>

                <button onclick="configureKeys()" class="p-2.5 border-l border-[var(--border-color)] hover:bg-black/5 dark:hover:bg-white/5 transition flex items-center justify-center text-[var(--text-main)]" title="Configurar API Key">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
                    </svg>
                </button>

            </div>
        </div>
    </header>

    <!-- Contenedor del chat (Se redujo space-y-10 a space-y-5 para evitar huecos enormes) -->
    <main id="chat-container" class="flex-1 overflow-y-auto overflow-x-hidden px-4 py-5 space-y-5 max-w-3xl w-full mx-auto"></main>

    <!-- Barra de entrada -->
    <footer class="p-3 bg-[var(--bg-main)] flex flex-col items-center transition-colors duration-300 relative flex-shrink-0 pb-6">

        <form id="chat-form" class="gemini-input-container w-full max-w-3xl rounded-[28px] px-2 py-1.5 flex items-center gap-1 shadow-sm">

            <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.txt,.doc,.docx">

            <button type="button" onclick="document.getElementById('file-input').click()" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] p-2.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition flex items-center justify-center flex-shrink-0" title="Adjuntar archivo">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>

            <input
                type="text"
                id="user-input"
                placeholder="Pregúntale a Paul..."
                autocomplete="off"
                class="flex-1 bg-transparent text-[var(--text-main)] placeholder-[var(--text-secondary)] text-[15px] focus:outline-none py-2 px-1 min-w-0"
            >

            <button type="button" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] p-2.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition flex items-center justify-center flex-shrink-0" title="Dictado por voz">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>

            <button
                type="submit"
                id="send-btn"
                class="bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-400 hover:bg-blue-200 dark:hover:bg-blue-900 p-2.5 rounded-full transition flex items-center justify-center flex-shrink-0"
            >
                <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7"></path>
                </svg>
            </button>
        </form>

        <div id="file-indicator" class="text-[11px] text-blue-500 mt-2 hidden font-medium absolute bottom-16 bg-[var(--bg-main)] px-3 py-1 rounded-full shadow-sm border border-[var(--border-color)]">
            📎 Archivo adjunto listo
        </div>
    </footer>

    <!-- Script de gestión -->
    <script>
        const chatContainer = document.getElementById("chat-container");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const fileInput = document.getElementById("file-input");
        const fileIndicator = document.getElementById("file-indicator");
        const historyDrawer = document.getElementById("history-drawer");
        const historyList = document.getElementById("history-list");

        let attachedFile = null;

        let chatHistory = JSON.parse(localStorage.getItem('paul_chat_history')) || [];
        let sessions = JSON.parse(localStorage.getItem('paul_sessions')) || [];

        // --- CONTROL DEL SCROLL AUTOMÁTICO ---
        let userInteracted = false;
        let touchStartY = 0;
        let lastTouchY = 0;
        let manualScrollGesture = false;

        checkKeysState();
        renderStoredHistory();
        updateHistoryDrawerList();

        function isScrolledToBottom() {
            return chatContainer.scrollHeight - chatContainer.scrollTop
                <= chatContainer.clientHeight + 50;
        }

        function keepChatAtBottom() {
            if (!userInteracted) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        chatContainer.addEventListener('wheel', (e) => {
            manualScrollGesture = true;
            if (e.deltaY < 0) {
                userInteracted = true;
            }
        }, { passive: true });

        chatContainer.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            lastTouchY = touchStartY;
            manualScrollGesture = false;
        }, { passive: true });

        chatContainer.addEventListener('touchmove', (e) => {
            const y = e.touches[0].clientY;
            if (Math.abs(y - touchStartY) > 8) {
                manualScrollGesture = true;
                if (y > lastTouchY && !isScrolledToBottom()) {
                    userInteracted = true;
                }
            }
            lastTouchY = y;
        }, { passive: true });

        chatContainer.addEventListener('scroll', () => {
            if (isScrolledToBottom()) {
                userInteracted = false;
            } else if (manualScrollGesture) {
                userInteracted = true;
            }
        }, { passive: true });

        chatContainer.addEventListener('touchend', () => {
            if (isScrolledToBottom()) {
                userInteracted = false;
            }
            manualScrollGesture = false;
        }, { passive: true });

        chatContainer.addEventListener('touchcancel', () => {
            if (isScrolledToBottom()) {
                userInteracted = false;
            }
            manualScrollGesture = false;
        }, { passive: true });

        // --- CONFIGURACIÓN DE API KEY ---
        function configureKeys() {
            const currentKey = localStorage.getItem('paul_groq_key') || '';

            const groqKey = prompt(
                "Ingresa tu API Key de Groq (empieza con gsk_):",
                currentKey
            );

            if (groqKey !== null) {
                const cleanKey = groqKey.trim();

                if (cleanKey === '') {
                    localStorage.removeItem('paul_groq_key');
                    alert("Se ha borrado la llave guardada.");
                    return;
                }

                if (!cleanKey.startsWith('gsk_')) {
                    alert("⚠️ Una clave de Groq válida debe empezar con 'gsk_'. Por favor verifica tu llave.");
                    return;
                }

                localStorage.setItem('paul_groq_key', cleanKey);
                alert("¡Llave de Groq guardada correctamente!");
            }
        }

        function checkKeysState() {
            const groqKey = localStorage.getItem('paul_groq_key');

            if (!groqKey || groqKey.trim() === '') {
                setTimeout(() => {
                    alert("⚠️ Asegúrate de configurar tu API Key de Groq tocando el menú de tres puntos superior derecho.");
                }, 1000);
            }
        }

        // --- MANEJO DEL TEMA ---
        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

        function updateThemeColor(e) {
            document.getElementById('theme-color-meta').setAttribute(
                'content',
                e.matches ? '#131314' : '#ffffff'
            );
        }

        darkModeMediaQuery.addEventListener('change', updateThemeColor);
        updateThemeColor(darkModeMediaQuery);

        document.addEventListener('gesturestart', (e) => e.preventDefault());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                attachedFile = e.target.files[0];

                fileIndicator.innerText = `📎 Adjunto: ${attachedFile.name}`;
                fileIndicator.classList.remove('hidden');

                setTimeout(() => {
                    fileIndicator.classList.add('hidden');
                }, 3000);
            }
        });

        // --- HISTORIAL Y SESIONES ---
        function toggleHistoryDrawer() {
            historyDrawer.classList.toggle('hidden');
            updateHistoryDrawerList();
        }

        function updateHistoryDrawerList() {
            historyList.innerHTML = '';

            if (chatHistory.length > 0) {
                const currentSessionBtn = document.createElement('div');

                currentSessionBtn.className =
                    "p-3 rounded-xl bg-black/5 dark:bg-white/5 cursor-pointer text-sm font-medium truncate flex items-center justify-between";

                const firstUserMsg = chatHistory.find(m => m.role === 'user');

                currentSessionBtn.innerHTML =
                    `<span>💬 ${firstUserMsg ? firstUserMsg.content.substring(0, 25) + '...' : 'Chat actual'}</span> <span class="text-xs text-blue-500">Activo</span>`;

                historyList.appendChild(currentSessionBtn);
            }

            if (sessions.length === 0 && chatHistory.length === 0) {
                historyList.innerHTML =
                    `<p class="text-xs text-[var(--text-secondary)] text-center py-4">No hay chats guardados</p>`;
                return;
            }

            sessions.forEach((session, idx) => {
                const item = document.createElement('div');

                item.className =
                    "p-3 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer text-sm truncate flex items-center justify-between text-[var(--text-secondary)] hover:text-[var(--text-main)] transition";

                item.innerHTML = `<span>🗨️ ${session.title || 'Conversación anterior'}</span>`;
                item.onclick = () => loadSession(idx);

                historyList.appendChild(item);
            });
        }

        function startNewChat() {
            if (chatHistory.length > 0) {
                const firstMsg = chatHistory.find(m => m.role === 'user');

                const title = firstMsg
                    ? firstMsg.content.substring(0, 25) + '...'
                    : 'Chat anterior';

                sessions.unshift({
                    title,
                    history: [...chatHistory]
                });

                localStorage.setItem('paul_sessions', JSON.stringify(sessions));
            }

            localStorage.removeItem('paul_chat_history');
            chatHistory = [];
            userInteracted = false;
            chatContainer.innerHTML = '';

            appendMessage('bot', '¡Hola! ¿En qué te puedo ayudar hoy?', null, false, null);
            toggleHistoryDrawer();
        }

        function loadSession(idx) {
            const session = sessions[idx];

            if (session) {
                if (chatHistory.length > 0) {
                    const firstMsg = chatHistory.find(m => m.role === 'user');

                    const title = firstMsg
                        ? firstMsg.content.substring(0, 25) + '...'
                        : 'Chat anterior';

                    sessions.unshift({
                        title,
                        history: [...chatHistory]
                    });
                }

                chatHistory = [...session.history];
                sessions.splice(idx, 1);

                localStorage.setItem('paul_sessions', JSON.stringify(sessions));
                localStorage.setItem('paul_chat_history', JSON.stringify(chatHistory));

                userInteracted = false;
                renderStoredHistory();
                toggleHistoryDrawer();
            }
        }

        function renderStoredHistory() {
            chatContainer.innerHTML = '';

            if (chatHistory.length === 0) {
                appendMessage('bot', '¡Hola! ¿En qué te puedo ayudar hoy?', null, false, null);
            } else {
                chatHistory.forEach((msg, index) => {
                    appendMessage(msg.role, msg.content, null, false, index);
                });
            }
        }

        // --- FORMATEADOR CON SOPORTE DE YOUTUBE ---
        function formatMarkdownWithYouTube(rawText) {
            if (!rawText) return '';

            let ytQuery = null;

            // Extraer etiqueta [YT: tema] si la IA la incluyó
            const ytMatch = rawText.match(/\[YT:\s*(.+?)\]/i);
            let cleanText = rawText.replace(/\[YT:\s*(.+?)\]/gi, '').trim();

            if (ytMatch && ytMatch[1]) {
                ytQuery = ytMatch[1].trim();
            }

            let html = marked.parse(cleanText);

            // Si en el texto hay un link directo de YouTube con ID válido, incrustar el reproductor
            const ytUrlRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
            html = html.replace(ytUrlRegex, (match, videoId) => {
                return `
                <div class="my-3 rounded-2xl overflow-hidden shadow-md border border-[var(--border-color)] aspect-video w-full">
                    <iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>`;
            });

            // Si la IA generó recomendación de video [YT: ...], mostrar tarjeta interactiva de YouTube
            if (ytQuery) {
                const searchUrl = `https://m.youtube.com/results?search_query=${encodeURIComponent(ytQuery)}`;
                html += `
                <a href="${searchUrl}" target="_blank" rel="noopener noreferrer" class="yt-card">
                    <div class="yt-icon-box">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-semibold text-red-500 uppercase tracking-wider">YouTube • Video recomendado</div>
                        <div class="text-sm font-medium truncate mt-0.5">${ytQuery}</div>
                        <div class="text-xs text-[var(--text-secondary)] mt-0.5">Toca para ver el video en YouTube</div>
                    </div>
                    <svg class="w-5 h-5 text-[var(--text-secondary)] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>`;
            }

            return html;
        }

        // --- RENDERIZADO DE MENSAJES ---
        function appendMessage(sender, text, fileObj = null, isTyping = false, historyIndex = null) {
            const isUser = sender === 'user' || sender === 'system';

            if (sender === 'system') return;

            const row = document.createElement('div');

            row.className =
                `flex w-full max-w-full ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubbleContainer = document.createElement('div');

            bubbleContainer.className =
                `flex flex-col ${isUser ? 'items-end max-w-[85%]' : 'items-start w-full'}`;

            const bubble = document.createElement('div');

            bubble.className =
                `markdown-content ${isUser ? 'gemini-bubble-user' : 'gemini-bubble-ai'}`;

            if (fileObj) {
                if (fileObj.type.startsWith('image/')) {
                    const img = document.createElement('img');

                    img.src = URL.createObjectURL(fileObj);
                    img.className = "max-w-[200px] rounded-xl mb-2 shadow-sm";

                    bubble.appendChild(img);
                } else {
                    const fileTag = document.createElement('div');

                    fileTag.className = "text-xs opacity-80 mb-1 font-semibold";
                    fileTag.innerText = `📄 Archivo: ${fileObj.name}`;

                    bubble.appendChild(fileTag);
                }
            }

            const textNode = document.createElement('div');
            textNode.className = "overflow-x-auto";

            if (isTyping) {
                textNode.innerHTML =
                    `<span class="typing-dot"></span> <span class="typing-dot"></span> <span class="typing-dot"></span>`;
            } else {
                textNode.innerHTML = isUser ? marked.parse(text) : formatMarkdownWithYouTube(text);
            }

            bubble.appendChild(textNode);

            if (isUser) {
                bubbleContainer.appendChild(bubble);
            } else {
                const aiTextWrapper = document.createElement('div');

                aiTextWrapper.className = "w-full";
                aiTextWrapper.appendChild(bubble);

                bubbleContainer.appendChild(aiTextWrapper);
            }

            if (!isTyping) {
                const actionsBar = document.createElement('div');

                // Menos margen en el botón del usuario (mt-1) para no empujar la respuesta hacia abajo
                actionsBar.className =
                    `flex items-center gap-1 text-[var(--text-secondary)] ${isUser ? 'mt-1' : 'mt-2'} px-1`;

                if (isUser && historyIndex !== null) {
                    const editBtn = document.createElement('button');

                    editBtn.className =
                        "hover:text-[var(--text-main)] transition p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/5";

                    editBtn.title = "Editar mensaje";

                    editBtn.innerHTML =
                        `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`;

                    editBtn.onclick = () => editMessage(historyIndex);
                    actionsBar.appendChild(editBtn);

                } else if (!isUser) {
                    const copyBtn = document.createElement('button');

                    copyBtn.className =
                        "hover:text-[var(--text-main)] transition p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5";

                    copyBtn.title = "Copiar";

                    copyBtn.innerHTML =
                        `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>`;

                    copyBtn.onclick = async () => {
                        try {
                            await navigator.clipboard.writeText(text.replace(/\[YT:\s*(.+?)\]/gi, '').trim());

                            copyBtn.innerHTML =
                                `<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;

                            setTimeout(() => {
                                copyBtn.innerHTML =
                                    `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>`;
                            }, 2000);
                        } catch (error) {
                            console.error("No se pudo copiar el mensaje:", error);
                        }
                    };

                    actionsBar.appendChild(copyBtn);

                    const thumbsUp = document.createElement('button');

                    thumbsUp.className =
                        "hover:text-[var(--text-main)] transition p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5";

                    thumbsUp.innerHTML =
                        `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714.211 1.412.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>`;

                    actionsBar.appendChild(thumbsUp);

                    const thumbsDown = document.createElement('button');

                    thumbsDown.className =
                        "hover:text-[var(--text-main)] transition p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5";

                    thumbsDown.innerHTML =
                        `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76.94m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904-.212-1.413-.608-2.006L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5"></path></svg>`;

                    actionsBar.appendChild(thumbsDown);

                    const moreBtn = document.createElement('button');

                    moreBtn.className =
                        "hover:text-[var(--text-main)] transition p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5";

                    moreBtn.innerHTML =
                        `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>`;

                    actionsBar.appendChild(moreBtn);
                }

                bubbleContainer.appendChild(actionsBar);
            }

            if (!isUser && !isTyping) {
                const disclaimer = document.createElement('div');

                disclaimer.className =
                    "text-[11px] text-[var(--text-secondary)] mt-1 px-1 opacity-80";

                disclaimer.innerText = "Paul es una IA y puede cometer errores.";

                bubbleContainer.appendChild(disclaimer);
            }

            row.appendChild(bubbleContainer);
            chatContainer.appendChild(row);

            if (!isTyping) {
                keepChatAtBottom();
            }

            return bubble;
        }

        async function editMessage(index) {
            const oldMsg = chatHistory[index];

            if (!oldMsg || oldMsg.role !== 'user') return;

            const newText = prompt("Edita tu mensaje:", oldMsg.content);

            if (newText === null || newText.trim() === '') return;

            chatHistory = chatHistory.slice(0, index);

            localStorage.setItem(
                'paul_chat_history',
                JSON.stringify(chatHistory)
            );

            renderStoredHistory();

            await processAndSend(newText.trim(), null);
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const text = userInput.value.trim();
            const fileToSend = attachedFile;

            if (!text && !fileToSend) return;

            userInput.value = "";
            attachedFile = null;

            fileIndicator.classList.add('hidden');
            fileInput.value = "";

            let messageText = text;

            if (fileToSend) {
                messageText += ` [Archivo adjunto: ${fileToSend.name}]`;
            }

            await processAndSend(messageText, fileToSend);
        });

        // --- PROCESAMIENTO PRINCIPAL DE LA IA ---
        async function processAndSend(messageText, fileToSend) {
            chatHistory.push({
                role: "user",
                content: messageText
            });

            localStorage.setItem(
                'paul_chat_history',
                JSON.stringify(chatHistory)
            );

            userInteracted = false;
            renderStoredHistory();

            const botBubbleContainer = appendMessage('bot', '', null, true);
            const textContainer = botBubbleContainer.querySelector('div');

            try {
                const apiKey = localStorage.getItem('paul_groq_key');

                if (!apiKey) {
                    throw new Error(
                        "Falta configurar tu API Key de Groq. Toca el menú de tres puntos en la parte superior derecha."
                    );
                }

                const systemPrompt = `Eres Paul, un asistente personal útil, directo, amigable y con un tono conversacional similar a Gemini.

REGLAS DE FORMATO OBLIGATORIAS:
1. Para estructurar tus respuestas, SIEMPRE usa títulos de nivel 2 o 3 con formato Markdown (ejemplo: '## 📸 Título de sección' o '### ✍️ Otro título').
2. Acompaña cada título con un emoji al inicio que represente la sección.
3. Usa viñetas ('* ') para enumerar puntos dentro de las secciones. Evita usar listas numeradas (1. 2. 3.) a menos que sea estrictamente necesario (ej. pasos a seguir).
4. Deja espacio limpio entre párrafos para que la lectura sea cómoda.
5. Usa **negritas** solo para resaltar palabras clave dentro de las viñetas.
6. No uses introducciones robóticas. Sé cálido, colaborativo y directo.
7. VIDEO DE YOUTUBE OBLIGATORIO EN TEMAS INFORMATIVOS: Cuando el usuario pregunte sobre historia, ciencia, tutoriales, tecnología, cultura o cualquier tema explicativo, incluye SIEMPRE al final de tu respuesta una línea con el formato exacto: [YT: título específico del video a buscar en YouTube]. Ejemplo: [YT: Cómo fue la conquista del Imperio Inca documental]`;

                const apiMessages = [
                    {
                        role: "system",
                        content: systemPrompt
                    },
                    ...chatHistory.map(m => ({
                        role: m.role,
                        content: m.content
                    }))
                ];

                const apiUrl =
                    "https://api.groq.com/openai/v1/chat/completions";

                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                };

                const requestBody = {
                    model: "openai/gpt-oss-120b",
                    messages: apiMessages,
                    stream: true
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errData = await response.json();

                    throw new Error(
                        errData.error?.message || "Error en la red"
                    );
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullResponse = "";

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    const chunk = decoder.decode(value, {
                        stream: true
                    });

                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        const trimmed = line.trim();

                        if (!trimmed.startsWith("data: ")) continue;

                        const jsonStr = trimmed.replace("data: ", "");

                        if (jsonStr === "[DONE]") continue;

                        try {
                            const parsed = JSON.parse(jsonStr);

                            const content =
                                parsed.choices[0]?.delta?.content || "";

                            if (content) {
                                fullResponse += content;

                                textContainer.innerHTML =
                                    formatMarkdownWithYouTube(fullResponse);

                                requestAnimationFrame(() => {
                                    keepChatAtBottom();
                                });
                            }
                        } catch (e) {
                            // Ignora fragmentos que no sean JSON válido.
                        }
                    }
                }

                chatHistory.push({
                    role: "assistant",
                    content: fullResponse
                });

                localStorage.setItem(
                    'paul_chat_history',
                    JSON.stringify(chatHistory)
                );

                renderStoredHistory();

            } catch (err) {
                console.error(err);
                textContainer.innerText = "Error: " + err.message;
            }
        }
    </script>
