<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paul</title>

    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paul">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <meta name="theme-color" content="#ffffff" id="theme-color-meta">

    <style>
        :root {
            --bg-main: #ffffff;
            --bg-header: #ffffff;
            --border-color: #e5e5e5;
            --text-main: #1f1f1f;
            --text-secondary: #5f6368;
            --bubble-user: #f0f4f9;
            --bubble-user-text: #1f1f1f;
            --input-bg: #f0f4f9;
            --input-border: transparent;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #131314;
                --bg-header: #131314;
                --border-color: #3c4043;
                --text-main: #e3e3e3;
                --text-secondary: #9aa0a6;
                --bubble-user: #282a2c;
                --bubble-user-text: #e3e3e3;
                --input-bg: #1e1f20;
                --input-border: transparent;
            }
        }

        html, body {
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .gemini-header {
            background-color: var(--bg-header);
            border-color: var(--border-color);
        }

        .gemini-bubble-ai {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.7;
            width: 100%;
        }

        .gemini-bubble-user {
            background-color: var(--bubble-user);
            color: var(--bubble-user-text);
            border-radius: 24px;
            padding: 12px 18px;
            width: fit-content;
            max-width: 100%;
            font-size: 1.05rem;
            line-height: 1.5;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .gemini-input-container {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            transition: all 0.2s ease;
        }

        .gemini-input-container:focus-within {
            background-color: var(--bg-main);
            border-color: var(--border-color);
        }

        .markdown-content {
            overflow-wrap: break-word;
            max-width: 100%;
        }

        /* Elimina el margen superior del primer elemento de la respuesta para evitar espacios grandes */
        .markdown-content > *:first-child {
            margin-top: 0 !important;
        }

        .markdown-content p {
            margin-bottom: 1.1rem;
        }

        .markdown-content p:last-child {
            margin-bottom: 0;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            font-size: 1.35rem;
            font-weight: 500;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
        }

        .markdown-content ul {
            list-style-type: disc;
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .markdown-content ol {
            list-style-type: decimal;
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .markdown-content li {
            margin-bottom: 0.65rem;
            padding-left: 0.25rem;
        }

        .markdown-content strong {
            font-weight: 600;
        }

        .markdown-content code {
            background: rgba(0,0,0,0.06);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 90%;
            word-break: break-all;
        }

        .markdown-content table {
            width: 100%;
            display: block;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 1.5rem;
            border-collapse: collapse;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        @media (prefers-color-scheme: dark) {
            .markdown-content code {
                background: rgba(255,255,255,0.1);
            }
        }

        @keyframes bounce-custom {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1.0);
            }
        }

        .typing-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce-custom 1.4s infinite ease-in-out both;
            margin-right: 2px;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
