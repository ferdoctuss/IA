<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paul</title>
    
    <!-- Configuración para Iconos y Pantalla de Inicio (iOS y Android) -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paul">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#131314" id="theme-color-meta">
    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-header: #f8f9fa;
            --border-color: #dadce0;
            --text-main: #1f1f1f;
            --text-secondary: #5f6368;
            --bubble-ai: #f0f4f9;
            --bubble-ai-border: #d3e3fd;
            --bubble-user: #0b57d0;
            --bubble-user-text: #ffffff;
            --input-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #131314;
                --bg-header: #131314;
                --border-color: #3c4043;
                --text-main: #e3e3e3;
                --text-secondary: #9aa0a6;
                --bubble-ai: #1e1f20;
                --bubble-ai-border: #3c4043;
                --bubble-user: #004a77;
                --bubble-user-text: #ffffff;
                --input-bg: #1e1f20;
            }
        }

        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .gemini-header {
            background-color: var(--bg-header);
            border-color: var(--border-color);
        }

        .gemini-bubble-ai {
            background-color: var(--bubble-ai);
            border: 1px solid var(--bubble-ai-border);
            color: var(--text-main);
        }

        .gemini-bubble-user {
            background-color: var(--bubble-user);
            color: var(--bubble-user-text);
        }

        .gemini-input-container {
            background-color: var(--input-bg);
            border-color: var(--border-color);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col justify-between">

    <!-- Cabecera -->
    <header class="gemini-header flex items-center justify-between px-4 py-3 border-b select-none z-10 transition-colors duration-300">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" alt="Paul Logo" class="w-8 h-8 rounded-full object-cover shadow-md border border-[var(--border-color)]">
            <div>
                <h1 class="text-base font-medium tracking-wide flex items-center gap-2">
                    Paul <span class="text-[10px] font-normal px-2 py-0.5 rounded-full bg-orange-500/10 text-orange-500 border border-orange-500/20">Groq LPU</span>
                </h1>
                <p class="text-xs text-[var(--text-secondary)]">Asistente personal ultrarrápido</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <!-- Botón de Llave siempre visible -->
            <button id="keys-btn" onclick="configureKeys()" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] p-2 rounded-full transition text-xs flex items-center gap-1 border border-[var(--border-color)] px-3 py-1 rounded-full" title="Configurar API Key">
                🔑 Llave
            </button>
            <button onclick="location.reload()" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] p-2 rounded-full transition" title="Reiniciar chat">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </header>

    <!-- Contenedor del Chat -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <img src="logo.jpg" alt="Paul" class="w-8 h-8 rounded-full object-cover flex-shrink-0 shadow border border-[var(--border-color)]">
            <div class="gemini-bubble-ai rounded-2xl px-5 py-4 max-w-[85%] text-sm leading-relaxed shadow-sm">
                ¡Hola! Soy <strong>Paul</strong> impulsado por Groq. Estoy listo para ayudarte con tus consultas.
            </div>
        </div>
    </main>

    <!-- Barra de Entrada -->
    <footer class="p-3 gemini-header border-t flex flex-col items-center transition-colors duration-300 relative">
        <form id="chat-form" class="gemini-input-container w-full max-w-3xl border rounded-3xl px-3 py-2 flex items-center gap-2 focus-within:border-blue-500 transition shadow-lg">
            
            <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.txt,.doc,.docx">
            <button type="button" onclick="document.getElementById('file-input').click()" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] p-2 rounded-full transition flex items-center justify-center flex-shrink-0" title="Adjuntar archivo o foto">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            </button>

            <input 
                type="text" 
                id="user-input" 
                placeholder="Pregúntale a Paul..." 
                autocomplete="off"
                class="flex-1 bg-transparent text-[var(--text-main)] placeholder-[var(--text-secondary)] text-sm focus:outline-none py-2 px-1"
            >

            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-full transition flex items-center justify-center shadow flex-shrink-0"
            >
                <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7"></path></svg>
            </button>
        </form>
        <div id="file-indicator" class="text-[11px] text-blue-500 mt-1.5 hidden font-medium">📎 Archivo adjunto listo</div>
    </footer>

    <!-- Script de Gestión -->
    <script>
        const chatContainer = document.getElementById("chat-container");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const fileInput = document.getElementById("file-input");
        const fileIndicator = document.getElementById("file-indicator");

        // Modelo optimizado y veloz de Groq
        const selectedModel = "llama-3.3-70b-versatile";
        let attachedFile = null;

        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        function updateThemeColor(e) {
            document.getElementById('theme-color-meta').setAttribute('content', e.matches ? '#131314' : '#f8f9fa');
        }
        darkModeMediaQuery.addEventListener('change', updateThemeColor);
        updateThemeColor(darkModeMediaQuery);

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (event) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                attachedFile = e.target.files[0];
                fileIndicator.innerText = `📎 Adjunto: ${attachedFile.name}`;
                fileIndicator.classList.remove('hidden');
            }
        });

        function configureKeys() {
            const currentKey = localStorage.getItem('paul_groq_key') || '';
            const groqKey = prompt("Ingresa tu API Key de Groq (empieza con gsk_):", currentKey);
            if (groqKey !== null) {
                const cleanKey = groqKey.trim();
                if (cleanKey === '') {
                    localStorage.removeItem('paul_groq_key');
                    alert("Se ha borrado la llave guardada.");
                    return;
                }
                if (!cleanKey.startsWith('gsk_')) {
                    alert("⚠️ Una clave de Groq válida debe empezar con 'gsk_'. Por favor verifica tu llave.");
                    return;
                }
                localStorage.setItem('paul_groq_key', cleanKey);
                alert("¡Llave de Groq guardada correctamente en tu navegador!");
            }
        }

        function appendMessage(sender, text, fileObj = null) {
            const isUser = sender === 'user';
            const row = document.createElement('div');
            row.className = `flex items-start gap-3 w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            
            if (!isUser) {
                const avatar = document.createElement('img');
                avatar.src = "logo.jpg";
                avatar.className = "w-8 h-8 rounded-full object-cover flex-shrink-0 shadow border border-[var(--border-color)]";
                row.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl px-5 py-4 max-w-[85%] text-sm leading-relaxed shadow-sm ${
                isUser ? 'gemini-bubble-user rounded-br-sm' : 'gemini-bubble-ai rounded-bl-sm'
            }`;

            if (fileObj) {
                if (fileObj.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(fileObj);
                    img.className = "max-w-xs rounded-lg mb-2 shadow";
                    bubble.appendChild(img);
                } else {
                    const fileTag = document.createElement('div');
                    fileTag.className = "text-xs opacity-80 mb-1 font-semibold";
                    fileTag.innerText = `📄 Archivo: ${fileObj.name}`;
                    bubble.appendChild(fileTag);
                }
            }

            const textNode = document.createElement('div');
            textNode.innerText = text;
            bubble.appendChild(textNode);
            
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const fileToSend = attachedFile;

            if (!text && !fileToSend) return;

            userInput.value = "";
            attachedFile = null;
            fileIndicator.classList.add('hidden');
            fileInput.value = "";

            let messageText = text;
            if (fileToSend) {
                messageText += ` [Archivo adjunto: ${fileToSend.name}]`;
            }

            appendMessage('user', text || "Analiza este archivo:", fileToSend);
            const botBubble = appendMessage('bot', 'Pensando...');

            try {
                const apiKey = localStorage.getItem('paul_groq_key');
                if (!apiKey) {
                    throw new Error("Falta configurar tu API Key de Groq. Haz clic arriba en el botón '🔑 Llave' e ingresa tu clave.");
                }

                // Estructura de mensajes compatible con la API de Groq
                const messagesArray = [
                    { role: "system", content: "Eres Paul, un asistente personal útil, directo y amigable." },
                    { role: "user", content: messageText }
                ];

                const url = "https://api.groq.com/openai/v1/chat/completions";
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: messagesArray
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                botBubble.innerText = data.choices[0].message.content;
            } catch (err) {
                console.error(err);
                botBubble.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
