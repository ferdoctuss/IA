<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paul - IA Local</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#131314" id="theme-color-meta">
    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-header: #f8f9fa;
            --border-color: #dadce0;
            --text-main: #1f1f1f;
            --text-secondary: #5f6368;
            --bubble-ai: #f0f4f9;
            --bubble-ai-border: #d3e3fd;
            --bubble-user: #0b57d0;
            --bubble-user-text: #ffffff;
            --input-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #131314;
                --bg-header: #131314;
                --border-color: #3c4043;
                --text-main: #e3e3e3;
                --text-secondary: #9aa0a6;
                --bubble-ai: #1e1f20;
                --bubble-ai-border: #3c4043;
                --bubble-user: #004a77;
                --bubble-user-text: #ffffff;
                --input-bg: #1e1f20;
            }
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .gemini-header {
            background-color: var(--bg-header);
            border-color: var(--border-color);
        }

        .gemini-bubble-ai {
            background-color: var(--bubble-ai);
            border: 1px solid var(--bubble-ai-border);
            color: var(--text-main);
        }

        .gemini-bubble-user {
            background-color: var(--bubble-user);
            color: var(--bubble-user-text);
        }

        .gemini-input-container {
            background-color: var(--input-bg);
            border-color: var(--border-color);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden">

    <!-- Cabecera -->
    <header class="gemini-header flex items-center justify-between px-4 py-3 border-b select-none z-10 transition-colors duration-300">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 flex items-center justify-center text-white font-semibold text-sm shadow-md">
                P
            </div>
            <div>
                <h1 class="text-base font-medium tracking-wide flex items-center gap-2">
                    Paul <span class="text-[10px] font-normal px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-500 border border-blue-500/20">Local / IA</span>
                </h1>
                <p id="status" class="text-xs text-[var(--text-secondary)]">Preparando motor...</p>
            </div>
        </div>
        <button onclick="location.reload()" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] p-2 rounded-full transition" title="Reiniciar chat">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
    </header>

    <!-- Contenedor del Chat -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 flex-shrink-0 flex items-center justify-center text-white font-semibold text-xs shadow">
                P
            </div>
            <div class="gemini-bubble-ai rounded-2xl px-5 py-4 max-w-[85%] text-sm leading-relaxed shadow-sm">
                ¡Hola! Soy <strong>Paul</strong>, tu asistente personal local. Estoy configurando el entorno en tu dispositivo para funcionar sin internet.
            </div>
        </div>
    </main>

    <!-- Barra de Entrada -->
    <footer class="p-4 gemini-header border-t flex flex-col items-center transition-colors duration-300">
        <form id="chat-form" class="gemini-input-container w-full max-w-3xl border rounded-3xl px-4 py-2 flex items-center gap-3 focus-within:border-blue-500 transition shadow-lg">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Pregúntale a Paul..." 
                autocomplete="off"
                disabled
                class="flex-1 bg-transparent text-[var(--text-main)] placeholder-[var(--text-secondary)] text-sm focus:outline-none py-2 px-1 disabled:opacity-50"
            >
            <button 
                type="submit" 
                id="send-btn"
                disabled
                class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-full transition disabled:opacity-30 disabled:hover:bg-blue-600 flex items-center justify-center shadow"
            >
                <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7"></path></svg>
            </button>
        </form>
        <p class="text-[11px] text-[var(--text-secondary)] mt-2 text-center">Ejecutándose localmente en tu dispositivo.</p>
    </footer>

    <!-- Script de Integración Robusta -->
    <script type="module">
        import { CreateWebWorkerMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const statusText = document.getElementById("status");
        const chatContainer = document.getElementById("chat-container");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        const selectedModel = "Llama-3.2-3B-Instruct-q4f32_1-MLC";
        let engine;

        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        function updateThemeColor(e) {
            document.getElementById('theme-color-meta').setAttribute('content', e.matches ? '#131314' : '#f8f9fa');
        }
        darkModeMediaQuery.addEventListener('change', updateThemeColor);
        updateThemeColor(darkModeMediaQuery);

        async function initEngine() {
            try {
                statusText.innerText = "Conectando con el motor local...";
                
                // Configuración de app con manejo de reintento/fallbacks automáticos del motor
                engine = await CreateWebWorkerMLCEngine(
                    new URL('./worker.js', import.meta.url),
                    selectedModel,
                    {
                        initProgressCallback: (progress) => {
                            statusText.innerText = progress.text;
                        }
                    }
                );

                statusText.innerText = "Paul está listo (Offline)";
                statusText.classList.remove("text-[var(--text-secondary)]");
                statusText.classList.add("text-emerald-500");
                
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.placeholder = "Pregúntale a Paul...";
                userInput.focus();
            } catch (err) {
                console.error(err);
                statusText.innerText = "Error al iniciar motor en este navegador.";
                statusText.classList.add("text-rose-500");
                appendMessage('bot', "Lo siento, tu versión actual de iOS Safari restringe el uso directo de la GPU para IA web en esta vista. Te sugiero verificar si hay actualizaciones pendientes de iOS en Ajustes > General > Actualización de software.");
            }
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            
            const row = document.createElement('div');
            row.className = `flex items-start gap-3 w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            
            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = "w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 flex-shrink-0 flex items-center justify-center text-white font-semibold text-xs shadow";
                avatar.innerText = "P";
                row.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl px-5 py-4 max-w-[85%] text-sm leading-relaxed shadow-sm ${
                isUser 
                    ? 'gemini-bubble-user rounded-br-sm' 
                    : 'gemini-bubble-ai rounded-bl-sm'
            }`;
            bubble.innerText = text;
            
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || !engine) return;

            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            appendMessage('user', text);

            const botBubble = appendMessage('bot', 'Pensando...');

            try {
                const messages = [
                    { role: "system", content: "Eres Paul, un asistente personal inteligente, útil, directo y amigable que se ejecuta localmente en el dispositivo del usuario." },
                    { role: "user", content: text }
                ];

                const reply = await engine.chat.completion({ messages });
                botBubble.innerText = reply.choices[0].message.content;
            } catch (err) {
                console.error(err);
                botBubble.innerText = "Ocurrió un error al generar la respuesta.";
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });

        initEngine();
    </script>
</body>
</html>
